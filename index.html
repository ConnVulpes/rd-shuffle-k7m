<meta name="robots" content="noindex, nofollow">
<meta name="application-name" content="Raindrop シャッフル">
<meta name="theme-color" content="#2e3034">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#43464b; --bg-bottom:#2e3034;
  --bar:rgba(46,48,52,.82); --field:#3a3d42; --line:#55595f;
  --text:#ebecee; --muted:#a2a6ac;
  --accent:#9ec4e8; --accent-ink:#17222d;
  --card:#34373b; --ph:#3d4045;
  --focus:#c8e0f6;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg-top:#e3e5e8; --bg-bottom:#c9ccd1;
    --bar:rgba(227,229,232,.85); --field:#f2f3f5; --line:#b6bac0;
    --text:#24272b; --muted:#5b6066;
    --accent:#2d6aa3; --accent-ink:#ffffff;
    --card:#f4f5f6; --ph:#dcdfe3;
    --focus:#2d6aa3;
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%) fixed;
  background-color:var(--bg-bottom);
  color:var(--text);
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;
  font-size:15px; line-height:1.6;
}
header{
  position:sticky; top:0; z-index:5;
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
  padding:12px 20px;
  background:var(--bar);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
h1{font-size:15px; font-weight:700; margin:0 8px 0 0; letter-spacing:.02em}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{
  font:inherit; color:var(--muted); background:transparent; border:0;
  padding:6px 14px; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--field); color:var(--text); font-weight:500}
select,input{
  font:inherit; color:var(--text); background:var(--field);
  border:1px solid var(--line); border-radius:8px; padding:6px 10px;
}
select{max-width:280px}
.sizer{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px}
.sizer input{width:120px; padding:0; border:0; background:transparent; accent-color:var(--accent)}
.spacer{flex:1}
.status{color:var(--muted); font-size:13px}
.shuffle{
  font:inherit; font-weight:700; color:var(--accent-ink); background:var(--accent);
  border:0; border-radius:8px; padding:8px 20px; cursor:pointer;
}
.shuffle:disabled{opacity:.6; cursor:progress}
.icon-btn{
  font:inherit; color:var(--muted); background:transparent;
  border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

main{padding:20px}
.grid{display:flex; align-items:flex-start; gap:16px}
.col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:16px}
.card{
  position:relative; display:block;
  background:var(--card); border-radius:6px; overflow:hidden;
  color:inherit; text-decoration:none;
}
.card .thumb{display:block; width:100%; height:auto; background:var(--ph)}
.badge{
  position:absolute; top:8px; left:8px;
  font-size:11px; font-weight:700; line-height:1;
  padding:4px 7px; border-radius:4px;
  color:var(--accent-ink); background:var(--accent);
}
.ph{
  display:flex; align-items:center; justify-content:center;
  aspect-ratio:4/3; background:var(--ph); color:var(--muted);
  font-size:42px; font-weight:700;
}
.cap{display:flex; flex-direction:column; gap:6px; padding:8px 10px 10px}
.coll{font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:11px; line-height:1.4; padding:1px 7px; border-radius:999px; color:var(--text); background:var(--field); border:1px solid var(--line)}
.none{font-size:11px; color:var(--muted); font-style:italic}
body.no-cap .cap{display:none}
.card-link{display:block; color:inherit; text-decoration:none}
.icon-btn[aria-pressed="true"]{color:var(--text); background:var(--field)}
body.cur-idle, body.cur-idle *{cursor:none !important}
body.cur-idle .grid{pointer-events:none}
body.cur-idle .rd-btn{opacity:0 !important}
#curToggle{display:none}
@media (hover:hover){ #curToggle{display:inline-block} }
.more{padding:24px 0 8px; text-align:center; color:var(--muted); font-size:13px}

#peek{
  width:min(960px,94vw); height:min(88vh,1000px); padding:0;
  display:none; flex-direction:column; overflow:hidden;
}
#peek[open]{display:flex}
.peek-head{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line)}
.peek-titles{flex:1; min-width:0}
.peek-title{font-size:16px; font-weight:700; margin:0; line-height:1.4; overflow-wrap:anywhere}
.peek-url{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.peek-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
.peek-actions a{text-decoration:none; display:inline-flex; align-items:center}
.peek-body{flex:1; min-height:0; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:14px}
.peek-media{display:flex; justify-content:center; background:var(--ph); border-radius:6px; overflow:hidden}
.peek-media .thumb,.peek-media img{max-width:100%; max-height:62vh; width:auto; height:auto; display:block}
.peek-media .ph{width:100%}
.peek-frame{width:100%; flex:1; min-height:60vh; border:0; border-radius:6px; background:#fff}
.peek-embed{width:100%; min-height:62vh; border:0; border-radius:6px}
.peek-meta{display:flex; flex-direction:column; gap:8px; font-size:13px}
.peek-text{margin:0; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere}
.peek-note{color:var(--muted); font-size:12px}
@media (max-width:640px){
  #peek{width:100vw; height:100dvh; max-width:100vw; max-height:100dvh; border-radius:0; border:0}
  .peek-head{flex-wrap:wrap}
  .peek-actions{width:100%; justify-content:flex-start}
}
.rd-btn{
  position:absolute; top:8px; right:8px;
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:50%;
  color:var(--accent-ink); background:var(--accent);
  opacity:.85; box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.rd-btn:hover{opacity:1}
@media (hover:hover){
  .rd-btn{opacity:0}
  .card:hover .rd-btn,.rd-btn:focus-visible{opacity:.9}
}

.empty{max-width:520px; margin:12vh auto; text-align:center; color:var(--muted)}
.empty p{margin:0 0 8px}

dialog{
  border:1px solid var(--line); border-radius:10px; padding:22px;
  background:var(--card); color:var(--text); width:min(460px,92vw);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:16px; margin:0 0 10px}
dialog p{font-size:13px; color:var(--muted); margin:0 0 12px}
dialog input{width:100%; margin-bottom:14px}
.row{display:flex; gap:10px; justify-content:flex-end}

@media (max-width:640px){
  header{padding:10px 16px}
  main{padding:16px}
  select{max-width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Raindrop シャッフル</h1>
  <div class="seg" id="modeSeg" role="group" aria-label="範囲">
    <button type="button" data-mode="all">すべて</button>
    <button type="button" data-mode="folder">フォルダ</button>
    <button type="button" data-mode="tag">タグ</button>
  </div>
  <select id="picker" aria-label="フォルダまたはタグ" hidden></select>
  <select id="count" aria-label="一度に読み込む件数">
    <option value="20">20件ずつ</option>
    <option value="40">40件ずつ</option>
    <option value="80">80件ずつ</option>
  </select>
  <label class="sizer" for="size" title="表示サイズ（キー 1・2・3 で小・中・大）">
    <span aria-hidden="true">小</span>
    <input type="range" id="size" min="170" max="380" step="5" aria-label="表示サイズ">
    <span aria-hidden="true">大</span>
  </label>
  <span class="spacer"></span>
  <span class="status" id="status" aria-live="polite"></span>
  <button type="button" class="shuffle" id="shuffle">シャッフル</button>
  <button type="button" class="icon-btn" id="capToggle" aria-pressed="true" title="タグとコレクションの表示を切り替えます（キー C）">キャプション</button>
  <button type="button" class="icon-btn" id="curToggle" aria-pressed="true" title="マウスを止めて少したつとカーソルを隠します。隠れている間はカードに反応しません（キー H）">カーソル非表示</button>
  <button type="button" class="icon-btn" id="refresh" title="Raindrop から最新のブックマークを読み込み直します">更新</button>
  <button type="button" class="icon-btn" id="settings" aria-label="設定">設定</button>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="more" id="more" hidden></div>
  <div class="empty" id="empty">
    <p>シャッフルを押すと、ブックマークがランダムに並びます。</p>
    <p>カードを押すとこのページの中でプレビューが開き、右上の水滴ボタンで Raindrop の編集画面が開きます。下までスクロールすると続きが読み込まれます。</p>
  </div>
</main>

<dialog id="peek" aria-labelledby="peekTitle">
  <div class="peek-head">
    <div class="peek-titles">
      <h2 class="peek-title" id="peekTitle"></h2>
      <div class="peek-url" id="peekUrl"></div>
    </div>
    <div class="peek-actions">
      <button type="button" class="icon-btn" id="peekFrameBtn" title="サイト側が許可していれば、このページの中にサイトを表示します">ページを表示</button>
      <a class="icon-btn" id="peekRd" target="_blank" rel="noopener">Raindrop で開く</a>
      <a class="shuffle" id="peekOpen" target="_blank" rel="noopener noreferrer">サイトを開く</a>
      <button type="button" class="icon-btn" id="peekClose">閉じる</button>
    </div>
  </div>
  <div class="peek-body" id="peekBody"></div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="tokenForm">
    <h2>Raindrop のトークン</h2>
    <p>Raindrop の「設定 → Integrations」で作ったアプリの test token を貼り付けてください。トークンはこのブラウザの中にだけ保存されます。</p>
    <input type="password" id="tokenInput" autocomplete="off" placeholder="トークンを貼り付け">
    <div class="row">
      <button type="button" class="icon-btn" id="cancel">閉じる</button>
      <button type="submit" class="shuffle">保存</button>
    </div>
  </form>
</dialog>

<script>
const API = 'https://api.raindrop.io/rest/v1';
const PER = 50;
const DAY = 24 * 60 * 60 * 1000;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('rdshuffle:' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rdshuffle:' + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('rdshuffle:' + k); }catch(e){} }
};
const state = {
  token: store.get('token', ''),
  mode: store.get('mode', 'all'),
  coll: store.get('coll', ''),
  tag: store.get('tag', ''),
  count: store.get('count', 40),
  cap: store.get('cap', true),
  hideCur: store.get('hidecur', true),
  col: store.get('col', ({ s:170, m:250, l:380 })[store.get('size', 'm')] || 250)
};
// cache: { savedAt, items:[{i,t,l,c,d,k,g}], colls:[{id,label,parent}], tags:[{name,count}] }
let cache = store.get('cache', null);
let kids = new Map();      // folder id -> child folder ids
let folderCount = new Map();
let collLabel = new Map();  // folder id -> "親 / 子" label
let refreshing = false;

const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), statusEl = $('status');
const picker = $('picker'), countSel = $('count'), shuffleBtn = $('shuffle'), refreshBtn = $('refresh');
const dlg = $('dlg'), tokenInput = $('tokenInput');
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function api(path, tries = 0){
  let res;
  try{ res = await fetch(API + path, { headers:{ Authorization:'Bearer ' + state.token } }); }
  catch(e){ throw new Error('network'); }
  if(res.status === 401) throw new Error('auth');
  if(res.status === 429){
    if(tries >= 3) throw new Error('rate');
    statusEl.textContent = '読み込みの上限に近いので、少し待っています…';
    await sleep(20000);
    return api(path, tries + 1);
  }
  if(!res.ok) throw new Error('http');
  return res.json();
}

function compact(it){
  const k = it.collection && it.collection.$id != null ? it.collection.$id : it.collectionId;
  return {
    i: it._id,
    t: it.title || '',
    l: it.link,
    c: it.cover || '',
    m: (it.media || []).filter(x => x && x.link).slice(0, 6).map(x => ({ l:x.link, t:x.type || '' })),
    y: it.type || '',
    d: it.domain || '',
    k: k,
    g: it.tags || []
  };
}

function buildColls(roots, children){
  const all = [...(roots.items || []), ...(children.items || [])];
  const byId = new Map(all.map(c => [c._id, c]));
  const parentOf = c => (c.parent && c.parent.$id != null) ? c.parent.$id : null;
  const pathOf = (c, depth = 0) => {
    const p = byId.get(parentOf(c));
    return (p && depth < 8) ? pathOf(p, depth + 1) + ' / ' + c.title : c.title;
  };
  return all.map(c => ({ id:c._id, label:pathOf(c), parent:parentOf(c) }))
    .sort((a, b) => a.label.localeCompare(b.label, 'ja'));
}

// Loads every bookmark once, a few pages at a time, and keeps a compact copy in this browser.
async function refreshAll(){
  if(!state.token){ openSettings(); return; }
  if(refreshing) return;
  refreshing = true;
  refreshBtn.disabled = true;
  if(!cache) setShuffleBusy(true);
  try{
    const [roots, children, tagRes] = await Promise.all([
      api('/collections'), api('/collections/childrens'), api('/tags/0')
    ]);
    const first = await api(`/raindrops/0?perpage=${PER}&page=0`);
    const total = first.count || 0;
    const pages = Math.ceil(total / PER);
    const out = new Array(pages);
    out[0] = first.items || [];
    let done = out[0].length;
    const progress = () => { statusEl.textContent = `読み込み中 ${done.toLocaleString()} / ${total.toLocaleString()}件`; };
    progress();
    let next = 1;
    const worker = async () => {
      while(next < pages){
        const p = next++;
        const r = await api(`/raindrops/0?perpage=${PER}&page=${p}`);
        out[p] = r.items || [];
        done += out[p].length;
        progress();
      }
    };
    await Promise.all([worker(), worker(), worker()]);

    const seen = new Set(), items = [];
    out.forEach(list => (list || []).forEach(it => {
      if(!it || seen.has(it._id)) return;
      seen.add(it._id);
      items.push(compact(it));
    }));
    cache = {
      v: 2,
      savedAt: Date.now(),
      items,
      colls: buildColls(roots, children),
      tags: (tagRes.items || []).map(t => ({ name:t._id, count:t.count || 0 }))
        .sort((a, b) => a.name.localeCompare(b.name, 'ja'))
    };
    const saved = store.set('cache', cache);
    applyCache();
    shuffle();
    if(!saved) statusEl.textContent += '（ブラウザに保存できなかったので、次に開いたときにまた読み込みます）';
  }catch(e){
    handleError(e);
  }finally{
    refreshing = false;
    refreshBtn.disabled = false;
    setShuffleBusy(false);
  }
}

function applyCache(){
  kids = new Map();
  cache.colls.forEach(c => {
    if(c.parent == null) return;
    if(!kids.has(c.parent)) kids.set(c.parent, []);
    kids.get(c.parent).push(c.id);
  });
  const direct = new Map();
  cache.items.forEach(x => direct.set(x.k, (direct.get(x.k) || 0) + 1));
  collLabel = new Map(cache.colls.map(c => [c.id, c.label]));
  folderCount = new Map();
  cache.colls.forEach(c => {
    let n = 0;
    descendants(c.id).forEach(id => { n += direct.get(id) || 0; });
    folderCount.set(c.id, n);
  });
  fillPicker();
}

function descendants(id){
  const set = new Set([id]);
  const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    (kids.get(cur) || []).forEach(k => { if(!set.has(k)){ set.add(k); stack.push(k); } });
  }
  return set;
}

function fillPicker(){
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  picker.hidden = state.mode === 'all';
  picker.innerHTML = '';
  if(state.mode === 'all') return;
  if(!cache){
    picker.append(new Option('読み込み中…', ''));
    return;
  }
  const list = state.mode === 'folder'
    ? cache.colls.map(c => ({ value:String(c.id), label:`${c.label}（${folderCount.get(c.id) || 0}）` }))
    : cache.tags.map(t => ({ value:t.name, label:`${t.name}（${t.count}）` }));
  if(!list.length){
    picker.append(new Option(state.mode === 'folder' ? 'フォルダがありません' : 'タグがありません', ''));
    return;
  }
  list.forEach(o => picker.append(new Option(o.label, o.value)));
  const current = state.mode === 'folder' ? String(state.coll) : state.tag;
  if(list.some(o => o.value === current)) picker.value = current;
  else { picker.selectedIndex = 0; savePick(); }
}

function savePick(){
  if(state.mode === 'folder'){ state.coll = picker.value; store.set('coll', state.coll); }
  if(state.mode === 'tag'){ state.tag = picker.value; store.set('tag', state.tag); }
}

function shuffleArray(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shuffling happens entirely in the browser: no requests to Raindrop.
// The whole filtered list is shuffled once; cards are added in batches as you scroll.
let order = [];
let shownCount = 0;
let poolSize = 0;

function shuffle(){
  if(!cache){ refreshAll(); return; }
  let pool = cache.items;
  if(state.mode === 'folder'){
    if(!state.coll){ statusEl.textContent = 'フォルダを選んでください。'; return; }
    const ids = descendants(Number(state.coll));
    pool = pool.filter(x => ids.has(x.k));
  }
  if(state.mode === 'tag'){
    if(!state.tag){ statusEl.textContent = 'タグを選んでください。'; return; }
    pool = pool.filter(x => x.g.includes(state.tag));
  }
  order = shuffleArray(pool.slice());
  poolSize = order.length;
  shownCount = 0;
  cardEls = [];
  layout(true);
  window.scrollTo({ top:0 });
  empty.hidden = poolSize > 0;
  if(!poolSize){
    moreEl.hidden = true;
    statusEl.textContent = 'この条件のブックマークはありません。';
    return;
  }
  appendMore();
}

function appendMore(){
  const next = order.slice(shownCount, shownCount + state.count);
  next.forEach(it => {
    const el = card(it);
    cardEls.push(el);
    placeCard(el);
  });
  shownCount += next.length;
  updateStatus();
}

function updateStatus(){
  statusEl.textContent = `${poolSize.toLocaleString()}件中 ${shownCount.toLocaleString()}件を表示（${ago(cache.savedAt)}に更新）`;
  moreEl.hidden = !poolSize;
  moreEl.textContent = shownCount < poolSize ? '続きを読み込み中…' : 'これで全部です。シャッフルで並べ直せます。';
}

// Masonry: a fixed set of columns, each new card goes into the shortest one,
// so cards added while scrolling never shuffle the ones already on screen.
let cols = [];
let colCount = 0;
let cardEls = [];

function wantedCols(){
  const gap = 16;
  const w = grid.clientWidth || document.documentElement.clientWidth;
  return Math.max(1, Math.floor((w + gap) / (state.col + gap)));
}

function layout(force){
  const n = wantedCols();
  if(!force && n === colCount) return;
  colCount = n;
  grid.innerHTML = '';
  cols = [];
  for(let i = 0; i < n; i++){
    const c = document.createElement('div');
    c.className = 'col';
    grid.append(c);
    cols.push(c);
  }
  cardEls.forEach(placeCard);
}

function placeCard(el){
  let best = cols[0];
  for(const c of cols) if(c.offsetHeight < best.offsetHeight) best = c;
  best.append(el);
}

function ago(t){
  const m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return 'たった今';
  if(m < 60) return `${m}分前`;
  const h = Math.floor(m / 60);
  if(h < 24) return `${h}時間前`;
  return `${Math.floor(h / 24)}日前`;
}

const VIDEO_EXT = /\.(mp4|webm|mov|m4v)(\?|#|$)/i;

// Thumbnail candidates in order: the cover, then each attached media item.
function thumbs(it){
  const list = [];
  const seen = new Set();
  const add = (url, type) => {
    if(!url || seen.has(url)) return;
    seen.add(url);
    list.push({ url, video: type === 'video' || VIDEO_EXT.test(url) });
  };
  const px = u => u.replace('://i.pximg.net/', '://i.pixiv.re/');
  add(px(it.c || ''), '');
  (it.m || []).forEach(x => add(px(x.l), x.t));
  return list;
}

// Thumbnails for sites that block direct embedding, found through public helper services.
const thumbCache = store.get('thumbs', {});
let thumbSaveTimer = 0;
function rememberThumb(link, url){
  thumbCache[link] = url;
  clearTimeout(thumbSaveTimer);
  thumbSaveTimer = setTimeout(() => {
    const keys = Object.keys(thumbCache);
    if(keys.length > 3000) keys.slice(0, keys.length - 3000).forEach(k => delete thumbCache[k]);
    store.set('thumbs', thumbCache);
  }, 1000);
}

async function siteThumbs(it){
  let u;
  try{ u = new URL(it.l); }catch(e){ return []; }
  const host = u.hostname.replace(/^(www|mobile)\./, '');
  if(host === 'pixiv.net'){
    const m = u.pathname.match(/artworks\/(\d+)/) || (u.searchParams.get('illust_id') || '').match(/(\d+)/);
    if(!m) return [];
    return [`https://pixiv.re/${m[1]}.jpg`, `https://pixiv.re/${m[1]}-1.jpg`];
  }
  if(host === 'x.com' || host === 'twitter.com'){
    const m = u.pathname.match(/status(?:es)?\/(\d+)/);
    if(!m) return [];
    if(it.l in thumbCache) return thumbCache[it.l] ? [thumbCache[it.l]] : [];
    try{
      const r = await fetch(`https://api.fxtwitter.com/status/${m[1]}`);
      const j = r.ok ? await r.json() : null;
      const media = j && j.tweet && j.tweet.media || {};
      const photo = media.photos && media.photos[0] && media.photos[0].url;
      const video = media.videos && media.videos[0] && media.videos[0].thumbnail_url;
      const mosaic = media.mosaic && media.mosaic.formats && media.mosaic.formats.jpeg;
      let url = photo || video || mosaic || '';
      if(url && /pbs\.twimg\.com\/media\//.test(url) && !url.includes('?')) url += '?name=small';
      if(r.ok || r.status === 404) rememberThumb(it.l, url);
      return url ? [url] : [];
    }catch(e){
      return [];
    }
  }
  return [];
}

// Shows the first candidate that loads; falls back to the next one, then to a letter tile.
function mediaEl(it, list, i){
  if(i >= list.length){
    if(list.extra) return placeholder(it);
    const ph = placeholder(it);
    siteThumbs(it).then(urls => {
      if(!urls.length || !ph.isConnected) return;
      const more = urls.map(url => ({ url, video:false }));
      more.extra = true;
      ph.replaceWith(mediaEl(it, more, 0));
    });
    return ph;
  }
  const cand = list[i];
  let el;
  if(cand.video){
    el = document.createElement('video');
    el.muted = true;
    el.playsInline = true;
    el.preload = 'metadata';
    el.src = cand.url + (cand.url.includes('#') ? '' : '#t=0.1');
  }else{
    el = new Image();
    el.loading = 'lazy';
    el.decoding = 'async';
    el.alt = '';
    el.referrerPolicy = 'no-referrer';
    el.src = cand.url;
  }
  el.className = 'thumb';
  el.addEventListener('error', () => el.replaceWith(mediaEl(it, list, i + 1)), { once:true });
  return el;
}

// The bookmark's own page in the Raindrop web app.
function raindropUrl(it){
  const coll = (it.k === 0 || it.k) ? it.k : 0;
  return `https://app.raindrop.io/my/${coll}/item/${it.i}/edit`;
}

const RD_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2.5c-.4 0-.8.2-1 .6C9.3 5.8 5.5 11 5.5 14.6A6.5 6.5 0 0 0 12 21a6.5 6.5 0 0 0 6.5-6.4C18.5 11 14.7 5.8 13 3.1c-.2-.4-.6-.6-1-.6Z"/></svg>';

function collName(it){
  if(it.k === -1) return '未整理';
  if(it.k === -99) return 'ゴミ箱';
  return collLabel.get(it.k) || '';
}

function captionEl(it){
  const cap = document.createElement('div');
  cap.className = 'cap';
  const c = document.createElement('div');
  c.className = 'coll';
  const name = collName(it);
  if(name){ c.textContent = name; c.title = name; }
  else { c.className = 'none'; c.textContent = 'コレクションなし'; }
  const tags = document.createElement('div');
  tags.className = 'tags';
  if(it.g && it.g.length){
    it.g.forEach(g => {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = '#' + g;
      tags.append(t);
    });
  }else{
    const n = document.createElement('span');
    n.className = 'none';
    n.textContent = 'タグなし';
    tags.append(n);
  }
  cap.append(c, tags);
  return cap;
}

function card(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const a = document.createElement('a');
  a.className = 'card-link';
  a.href = it.l;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.title = it.t || it.l;
  a.addEventListener('click', e => {
    // A plain click opens the preview; ⌘-click or a middle click still opens the site.
    if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    openPeek(it);
  });
  const list = thumbs(it);
  a.append(mediaEl(it, list, 0));
  a.append(captionEl(it));
  wrap.append(a);
  if(it.y === 'video' || list.some(x => x.video)){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = '動画';
    wrap.append(b);
  }
  const rd = document.createElement('a');
  rd.className = 'rd-btn';
  rd.href = raindropUrl(it);
  rd.target = '_blank';
  rd.rel = 'noopener';
  rd.title = 'Raindrop で開く';
  rd.setAttribute('aria-label', 'Raindrop で開く');
  rd.innerHTML = RD_ICON;
  wrap.append(rd);
  return wrap;
}

// ---- Preview ----
const peek = $('peek'), peekBody = $('peekBody');
let peekItem = null;

function embedFor(it){
  let u;
  try{ u = new URL(it.l); }catch(e){ return null; }
  const host = u.hostname.replace(/^(www|m|mobile|music)\./, '');
  if(host === 'youtube.com' || host === 'youtu.be'){
    const id = host === 'youtu.be' ? u.pathname.slice(1) : (u.searchParams.get('v') || (u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]+)/) || [])[1]);
    if(id) return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`;
  }
  if(host === 'x.com' || host === 'twitter.com'){
    const m = u.pathname.match(/status(?:es)?\/(\d+)/);
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    if(m) return `https://platform.twitter.com/embed/Tweet.html?id=${m[1]}&theme=${dark ? 'dark' : 'light'}&dnt=true`;
  }
  return null;
}

function openPeek(it){
  peekItem = it;
  $('peekTitle').textContent = it.t || it.l;
  $('peekUrl').textContent = it.l;
  $('peekOpen').href = it.l;
  $('peekRd').href = raindropUrl(it);
  $('peekFrameBtn').hidden = !!embedFor(it);
  peekBody.innerHTML = '';

  const embed = embedFor(it);
  if(embed){
    const f = document.createElement('iframe');
    f.className = 'peek-embed';
    f.src = embed;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    peekBody.append(f);
  }else{
    const box = document.createElement('div');
    box.className = 'peek-media';
    box.append(mediaEl(it, thumbs(it), 0));
    peekBody.append(box);
  }

  const meta = document.createElement('div');
  meta.className = 'peek-meta';
  meta.append(captionEl(it));
  const text = document.createElement('p');
  text.className = 'peek-text';
  meta.append(text);
  peekBody.append(meta);

  // Description and note are fetched on demand, one request per preview.
  api(`/raindrop/${it.i}`).then(r => {
    if(peekItem !== it) return;
    const x = r.item || {};
    const parts = [];
    if(x.excerpt) parts.push(x.excerpt);
    if(x.note) parts.push('メモ：' + x.note);
    text.textContent = parts.join('\n\n');
  }).catch(() => {});

  if(!peek.open) peek.showModal();
}

function showFrame(){
  const it = peekItem;
  if(!it) return;
  peekBody.innerHTML = '';
  const note = document.createElement('p');
  note.className = 'peek-note';
  note.textContent = '真っ白やエラーのままなら、そのサイトは他のページの中での表示を許可していません。「サイトを開く」を使ってください。';
  const f = document.createElement('iframe');
  f.className = 'peek-frame';
  f.src = it.l;
  f.referrerPolicy = 'no-referrer';
  f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
  peekBody.append(note, f);
  $('peekFrameBtn').hidden = true;
}

function closePeek(){
  if(peek.open) peek.close();
}

peek.addEventListener('close', () => { peekItem = null; peekBody.innerHTML = ''; });
peek.addEventListener('click', e => { if(e.target === peek) closePeek(); });
$('peekClose').addEventListener('click', closePeek);
$('peekFrameBtn').addEventListener('click', showFrame);

function placeholder(it){
  const div = document.createElement('div');
  div.className = 'ph';
  div.textContent = ((it.d || it.t || '?').replace(/^www\./, '')[0] || '?').toUpperCase();
  return div;
}

function handleError(e){
  const m = {
    auth:'トークンが無効です。設定から入れ直してください。',
    network:'Raindrop に接続できませんでした。ネット接続を確認してください。',
    rate:'読み込みの上限に達しました。1分ほど待ってから「更新」を押してください。'
  }[e.message] || '読み込みに失敗しました。「更新」をもう一度押してください。';
  statusEl.textContent = m;
  if(e.message === 'auth') openSettings();
}

function setShuffleBusy(b){
  shuffleBtn.disabled = b;
  shuffleBtn.textContent = b ? '読み込み中…' : 'シャッフル';
}

function openSettings(){
  tokenInput.value = state.token;
  if(typeof dlg.showModal === 'function') dlg.showModal();
  tokenInput.focus();
}

const moreEl = $('more');
const capBtn = $('capToggle');
function applyCap(){
  document.body.classList.toggle('no-cap', !state.cap);
  capBtn.setAttribute('aria-pressed', String(state.cap));
}
function toggleCap(){
  state.cap = !state.cap;
  store.set('cap', state.cap);
  applyCap();
}
capBtn.addEventListener('click', toggleCap);

// マウスを止めて少したつとカーソルを隠す。隠れている間はカードに反応しない
const curBtn = $('curToggle');
const canHover = matchMedia('(hover:hover)').matches;
const IDLE_MS = 1500;
let idleTimer = 0, lastX = null, lastY = null;
function setIdle(on){ document.body.classList.toggle('cur-idle', on); }
function armIdle(){
  clearTimeout(idleTimer);
  if(!state.hideCur || !canHover) return;
  idleTimer = setTimeout(() => {
    if(dlg.open || peek.open) return armIdle();
    setIdle(true);
  }, IDLE_MS);
}
function wake(){ setIdle(false); armIdle(); }
document.addEventListener('mousemove', e => {
  // スクロールだけで発生する見かけの移動は無視し、手で動かしたときだけ起こす
  if(lastX !== null && Math.abs(e.screenX - lastX) + Math.abs(e.screenY - lastY) < 3) return;
  lastX = e.screenX; lastY = e.screenY;
  wake();
}, {passive:true});
document.addEventListener('mousedown', wake, true);
document.documentElement.addEventListener('mouseleave', () => clearTimeout(idleTimer));
function applyCur(){
  curBtn.setAttribute('aria-pressed', String(state.hideCur));
  if(state.hideCur) armIdle(); else { clearTimeout(idleTimer); setIdle(false); }
}
function toggleCur(){
  state.hideCur = !state.hideCur;
  store.set('hidecur', state.hideCur);
  applyCur();
}
curBtn.addEventListener('click', toggleCur);

new IntersectionObserver(entries => {
  if(entries.some(e => e.isIntersecting) && shownCount < poolSize) appendMore();
}, { rootMargin:'1200px 0px' }).observe(moreEl);
// Keep filling while the page is still shorter than the window.
setInterval(() => {
  if(shownCount < poolSize && document.documentElement.scrollHeight - innerHeight - scrollY < 1200) appendMore();
}, 800);

let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => layout(false), 150); });

const sizeInput = $('size');
function applySize(){
  const v = Number(state.col);
  state.col = Number.isFinite(v) ? Math.min(380, Math.max(170, v)) : 250;
  sizeInput.value = String(state.col);
  layout(false);
}
function setSize(px){
  state.col = px;
  store.set('col', state.col);
  applySize();
}
sizeInput.addEventListener('input', () => setSize(Number(sizeInput.value)));
document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  store.set('mode', state.mode);
  fillPicker();
  if(cache) shuffle();
}));
picker.addEventListener('change', () => { savePick(); if(cache) shuffle(); });
countSel.addEventListener('change', () => {
  state.count = Number(countSel.value);
  store.set('count', state.count);
});
shuffleBtn.addEventListener('click', shuffle);
refreshBtn.addEventListener('click', refreshAll);
$('settings').addEventListener('click', openSettings);
$('cancel').addEventListener('click', () => dlg.close());
$('tokenForm').addEventListener('submit', () => {
  const next = tokenInput.value.trim();
  if(next !== state.token){
    state.token = next;
    store.set('token', state.token);
    cache = null;
    store.del('cache');
    fillPicker();
    order = []; poolSize = 0; shownCount = 0; cardEls = []; layout(true);
    if(state.token) refreshAll();
  }
});
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(['input', 'select', 'textarea'].includes(tag) || dlg.open || peek.open) return;
  if(e.key === 'c' || e.key === 'C') toggleCap();
  if(e.key === 'h' || e.key === 'H') toggleCur();
  if(e.key === 'r' || e.key === 'R'){ e.preventDefault(); shuffle(); }
  if(e.key === '1') setSize(170);
  if(e.key === '2') setSize(250);
  if(e.key === '3') setSize(380);
});

applyCap();
applyCur();
applySize();
countSel.value = String(state.count);
if(!['20', '40', '80'].includes(countSel.value)){ countSel.value = '40'; state.count = 40; }
if(cache && !(cache.v === 2 && cache.items && cache.colls && cache.tags)) cache = null;
if(cache) applyCache(); else fillPicker();
if(!state.token){
  openSettings();
}else if(cache){
  shuffle();
  if(Date.now() - cache.savedAt > DAY) refreshAll();
}else{
  refreshAll();
}
</script>
</body>
</html>
